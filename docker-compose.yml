services:
web:
image: nginx:latest
container_name: web
ports:
- "8080:80"
volumes:
- ./src:/var/www/html
- ./nginx/default.conf:/etc/nginx/conf.d/default.conf
depends_on:
- php
 
php:
build: ./php
container_name: php
volumes:
- ./src:/var/www/html
depends_on:
- db
 
db:
image: mysql:8.0
container_name: db
environment:
MYSQL_ROOT_PASSWORD: root
MYSQL_DATABASE: practicas
MYSQL_USER: alumno
MYSQL_PASSWORD: alumno